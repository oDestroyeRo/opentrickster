name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runs on main queue instead of cancelling, so a release never stops halfway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: Release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.next.outputs.releasable == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute the next version
        id: next
        run: python3 -I scripts/release_version.py --github-output "$GITHUB_OUTPUT"

  contracts:
    name: Engine and network contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.99.1
      - name: Format
        run: cargo fmt --all --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Test sampler heap cases
        run: node crates/net/tests/sampler.cjs
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test release tooling
        run: python3 -I -m unittest discover -s scripts/tests
      - name: Test build migration tooling
        run: python3 -I -m unittest discover -s tools/build-migrate/tests

  desktop:
    name: macOS desktop
    needs: version
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup default 1.99.1
      - name: Test desktop
        run: cargo test -p opentrickster-desktop --locked
      - name: Lint desktop
        run: cargo clippy -p opentrickster-desktop --all-targets --locked -- -D warnings
      - name: Build and sign app
        env:
          RELEASE: ${{ needs.version.outputs.release }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          arguments=(--target aarch64-apple-darwin)
          if [[ $RELEASE == true ]]; then
            arguments+=(--release-version "$VERSION")
          fi
          python3 scripts/package_macos.py "${arguments[@]}"
      - name: Archive app preserving executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/OpenTrickster.app dist/OpenTrickster-macOS-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/OpenTrickster-macOS-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [version, contracts, desktop]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The zip is an unarchived artifact named after its file. skip-decompress keeps it a zip.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenTrickster-macOS-arm64.zip
          path: release
          skip-decompress: true
      - name: Check the archive and write the checksum
        working-directory: release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The action names the file from a response header and falls back to "artifact".
          files=(*)
          [[ ${#files[@]} -eq 1 && -f ${files[0]} ]] || { echo "::error::Expected exactly one downloaded file."; exit 1; }
          [[ ${files[0]} == OpenTrickster-macOS-arm64.zip ]] || mv "${files[0]}" OpenTrickster-macOS-arm64.zip
          unzip -tq OpenTrickster-macOS-arm64.zip
          unzip -p OpenTrickster-macOS-arm64.zip OpenTrickster.app/Contents/Resources/build.json |
            jq -e --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
              '.version == $version and .source_revision == $revision and .source_dirty == false and .profile == "release"' \
              > /dev/null || { echo "::error::build.json does not describe this release."; exit 1; }
          sha256sum OpenTrickster-macOS-arm64.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::The release version is not MAJOR.MINOR.PATCH."; exit 1; }
          tag="v$VERSION"
          # matching-refs matches by prefix, so select the exact tag.
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.type + \" \" + .object.sha")
          if [[ -n $existing ]]; then
            read -r type sha <<< "$existing"
            if [[ $type == tag ]]; then
              sha=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object.sha)
            fi
            if [[ $sha == "$GITHUB_SHA" ]]; then
              echo "Tag $tag is already on $GITHUB_SHA; nothing to publish."
              exit 0
            fi
            echo "::error::Tag $tag exists on $sha, not on $GITHUB_SHA."
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "OpenTrickster $VERSION" \
            --generate-notes OpenTrickster-macOS-arm64.zip SHA256SUMS
