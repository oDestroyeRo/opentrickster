[package]
name = "opentrickster-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "opentrickster"
path = "src/main.rs"

[dependencies]
opentrickster-engine = { path = "../engine" }
opentrickster-net = { path = "../net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
raw-window-handle = "0.6"
getrandom = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-user-notifications = "0.3.2"
block2 = "0.6"
