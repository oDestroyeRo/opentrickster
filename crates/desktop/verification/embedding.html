<!doctype html>
<meta charset="utf-8">
<style>
html,body{margin:0;background:#0b0c0e;color:#e3e7eb;font:18px sans-serif}canvas{position:absolute;width:100%;height:100%}p{position:absolute;left:24px;top:16px;pointer-events:none}button{position:absolute;bottom:24px;left:24px;padding:12px}
</style>
<canvas id="canvas" width="960" height="540"></canvas>
<p>Offline embedding verification • WebGL2 • No account</p>
<button onclick="ipc.postMessage(JSON.stringify({kind:'click'}))">Verify page input</button>
<script>
const gl=document.querySelector('canvas').getContext('webgl2');let frames=0;
function tick(t){if(gl){gl.clearColor(.02,.12+.08*Math.sin(t/600),.13,1);gl.clear(gl.COLOR_BUFFER_BIT)}frames++;requestAnimationFrame(tick)}requestAnimationFrame(tick);
setInterval(()=>ipc.postMessage(JSON.stringify({kind:'fixture',webgl2:!!gl,frames,width:innerWidth,height:innerHeight})),500);
addEventListener('keydown',()=>ipc.postMessage(JSON.stringify({kind:'key'})));
window.hostRoundtrip=()=>ipc.postMessage(JSON.stringify({kind:'roundtrip'}));
</script>
