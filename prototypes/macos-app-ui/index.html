<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTrickster UI prototype</title>
<!--
  PROTOTYPE for issue #9. Throwaway, never ship. One app, three layout variants
  (?variant=A|B|C), both operating modes, every session state. All game values
  are sample data, not target-server evidence.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
:root[data-theme="dark"]{--desk:#07080A;--desk-glow:#18232B;--shadow:0 0 0 1px rgba(0,0,0,.6),0 26px 70px rgba(0,0,0,.55)}
:root[data-theme="light"]{--desk:#B9C0C9;--desk-glow:#DDE3EA;--shadow:0 0 0 1px rgba(0,0,0,.16),0 26px 60px rgba(30,40,55,.30)}
body{font-family:var(--font-ui);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-primary);background:var(--desk);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:default}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}
.ic.lg{width:20px;height:20px}
.spin{animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:12px}
.muted{color:var(--text-muted)}
.secondary{color:var(--text-secondary)}

.desk{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px 22px 86px;background:radial-gradient(1100px 680px at 28% 18%,var(--desk-glow),transparent 70%),var(--desk)}
.bare .desk{padding:14px}
.window{position:relative;container:window/inline-size;width:min(1560px,100%);height:min(960px,100%);display:flex;flex-direction:column;border-radius:var(--radius-window);overflow:hidden;background:var(--surface-base);box-shadow:var(--shadow)}

.tone-neutral{--tone:var(--status-neutral);--tone-subtle:var(--status-neutral-subtle)}
.tone-accent{--tone:var(--accent-default);--tone-subtle:var(--accent-subtle)}
.tone-good{--tone:var(--status-good);--tone-subtle:var(--status-good-subtle)}
.tone-warning{--tone:var(--status-warning);--tone-subtle:var(--status-warning-subtle)}
.tone-serious{--tone:var(--status-serious);--tone-subtle:var(--status-serious-subtle)}
.tone-critical{--tone:var(--status-critical);--tone-subtle:var(--status-critical-subtle)}

.toolbar{height:var(--size-toolbar);flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:var(--surface-panel);border-bottom:1px solid var(--line-subtle)}
.traffic{display:flex;gap:8px;margin-right:6px}
.traffic i{width:12px;height:12px;border-radius:50%;display:block}
.traffic i:nth-child(1){background:#FF5F57}.traffic i:nth-child(2){background:#FEBC2E}.traffic i:nth-child(3){background:#28C840}
.app-title{font-weight:var(--weight-semibold);font-size:var(--fs-title);line-height:var(--lh-title);white-space:nowrap}
.spacer{flex:1}
.tb-group{display:flex;align-items:center;gap:8px}
.tb-sep{width:1px;height:22px;background:var(--line-subtle)}

.btn{height:var(--size-control);padding:0 12px;border-radius:var(--radius-control);border:1px solid var(--line-control);background:var(--surface-raised);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:var(--weight-medium);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-hover)}
.btn:disabled{opacity:.42}
.btn.primary{background:var(--accent-default);border-color:transparent;color:var(--text-on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn.primary:disabled{background:var(--surface-raised);border-color:var(--line-subtle);color:var(--text-muted);opacity:1}
.btn.proto{border-style:dashed;background:transparent;color:var(--text-secondary)}
.btn.sm{height:var(--size-control-small);padding:0 9px;font-size:var(--fs-small);border-radius:6px}
.btn.icon-only{width:var(--size-control);padding:0}
.btn .kbd{font-weight:var(--weight-regular);font-size:var(--fs-caption);opacity:.7}
.btn.stop .ic{color:var(--status-critical)}
.btn.primary .ic{color:inherit}
:focus-visible{outline:var(--size-focus-ring) solid var(--accent-default);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--accent-default);font-weight:var(--weight-medium)}

.seg{display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:var(--surface-base);border:1px solid var(--line-subtle)}
.seg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;font-weight:var(--weight-medium);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-selected);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--line-control)}
.seg button:disabled{opacity:.45}
.seg.sm button{height:20px;padding:0 8px;font-size:var(--fs-small)}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}

.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px 0 9px;border-radius:var(--radius-pill);background:var(--tone-subtle);font-weight:var(--weight-semibold);white-space:nowrap;max-width:100%}
.pill .ic{color:var(--tone)}
.pill .detail{font-weight:var(--weight-regular);color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;min-width:0}
.toolbar .pill{min-width:0}
.pill.big{height:34px;font-size:var(--fs-title);line-height:var(--lh-title);padding:0 14px 0 11px}

.pulse{height:var(--size-pulse);flex:none;position:relative;overflow:hidden;background:var(--line-subtle)}
.pulse.live{background:color-mix(in srgb,var(--tone) 32%,transparent)}
.pulse.live .beat{position:absolute;top:0;bottom:0;width:22%;left:-22%;background:linear-gradient(90deg,transparent,var(--tone),transparent);animation:beat var(--motion-pulse) var(--motion-easing) forwards}
@keyframes beat{to{left:100%}}
.pulse.hatch{background:repeating-linear-gradient(135deg,var(--tone) 0 6px,transparent 6px 11px)}
.pulse.march{background:repeating-linear-gradient(90deg,var(--tone) 0 12px,transparent 12px 20px);background-size:20px 100%;animation:march 700ms linear infinite}
@keyframes march{to{background-position:20px 0}}
.pulse.solid{background:var(--tone)}
.pulse.sweep::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:var(--tone);animation:sweep 1.3s var(--motion-easing) infinite}
@keyframes sweep{from{left:-30%}to{left:100%}}

.body{flex:1;min-height:0;display:flex}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.main.fit{container-type:size}
.main.fit>.stage{flex:none;height:min(calc(100cqw * 9 / 16 + 6px),calc(100cqh - 150px))}
.main.fit>.strip{flex:1;height:auto;min-height:150px}

.stage{position:relative;flex:1;min-height:0;container-type:size;display:grid;place-items:center;background:var(--surface-letterbox);padding:3px}
.stage.kbd-game{box-shadow:inset 0 0 0 2px var(--accent-default)}
.game{position:relative;width:min(100cqw - 6px,(100cqh - 6px) * 16 / 9);aspect-ratio:16/9;overflow:hidden;border-radius:2px}
.scene{position:absolute;inset:0;background:
  radial-gradient(60% 50% at 70% 30%,rgba(255,236,190,.18),transparent 70%),
  linear-gradient(180deg,#3E6E8E 0%,#5B8FA8 34%,#C9B37F 35%,#D7C08C 70%,#C4A86F 100%)}
.scene::before{content:"";position:absolute;inset:35% 0 0 0;background-image:linear-gradient(rgba(60,40,10,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(60,40,10,.12) 1px,transparent 1px);background-size:44px 22px;transform:perspective(500px) rotateX(38deg);transform-origin:top}
.scene .mk{position:absolute;transform:translate(-50%,-50%);border-radius:50%}
.scene .me{width:22px;height:22px;background:#F7F3E8;box-shadow:0 0 0 3px rgba(20,30,40,.55)}
.scene .foe{width:18px;height:18px;background:#7A3B2E;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.scene .foe.t{box-shadow:0 0 0 2px #fff,0 0 0 6px rgba(255,255,255,.25)}
.scene .spot{width:34px;height:20px;border-radius:50%;border:2px dashed rgba(70,40,10,.75);background:rgba(90,60,20,.18)}
.game-tag{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;background:rgba(10,12,14,.62);color:#E9EDF1;font-size:11px;line-height:16px}
.game-splash{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#1E2A36,#0E141A);color:#DCE4EC;text-align:center}
.game-splash .bar{width:260px;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin:14px auto 8px}
.game-splash .bar i{display:block;height:100%;background:#E9EDF1}
.game-splash .ttl{font-size:22px;font-weight:600;letter-spacing:.01em}
.login-card{width:300px;padding:18px;border-radius:12px;background:rgba(255,255,255,.08);text-align:left}
.login-card .fake{height:30px;border-radius:6px;background:rgba(255,255,255,.12);margin:8px 0}
.gpui-panel{position:absolute;inset:0;display:grid;place-items:center;background:var(--surface-panel);text-align:center;padding:24px}
.gpui-panel .inner{max-width:420px}
.gpui-panel h3{margin:10px 0 6px;font-size:var(--fs-heading);line-height:var(--lh-heading);font-weight:600}
.gpui-panel p{margin:0 0 14px;color:var(--text-secondary)}

.rail{width:var(--size-rail);flex:none;display:flex;flex-direction:column;min-height:0;background:var(--surface-panel);border-left:1px solid var(--line-subtle)}
.rail-head{padding:14px 16px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line-subtle)}
.controls{display:flex;gap:8px}
.controls .btn{flex:1}
.why-blocked{font-size:var(--fs-small);line-height:var(--lh-small);color:var(--text-secondary);display:flex;gap:6px;align-items:flex-start}
.why-blocked .ic{color:var(--status-warning);margin-top:1px}
.tabs{display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line-subtle);flex:none}
.tablist{display:flex;gap:4px}
.tabs-aside{margin-left:auto;padding-right:4px}
.status-line{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;font-size:var(--fs-small);line-height:var(--lh-small);color:var(--text-secondary)}
.tab{height:36px;padding:0 8px;border:0;background:none;color:var(--text-secondary);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;font-weight:var(--weight-medium)}
.tab[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--accent-default)}
.tab .kbd{font-size:var(--fs-caption);color:var(--text-muted);font-weight:400}
.scroll{flex:1;min-height:0;overflow:auto}
.section{padding:14px 16px;border-bottom:1px solid var(--line-subtle)}
.section:last-child{border-bottom:0}
.sec-title{font-size:var(--fs-small);line-height:var(--lh-small);font-weight:var(--weight-semibold);color:var(--text-secondary);margin:0 0 10px;display:flex;align-items:center;gap:6px}
.sec-title .aside{margin-left:auto;font-weight:400;color:var(--text-muted)}
.foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;border-top:1px solid var(--line-subtle);font-size:var(--fs-small);line-height:var(--lh-small);color:var(--text-secondary);white-space:nowrap;overflow:hidden}
.foot .ic{color:var(--text-muted)}
.build-bad{display:inline-flex;align-items:center;gap:5px;color:var(--text-primary)}
.build-bad .ic{color:var(--tone)}

.banner{display:flex;gap:10px;padding:12px 14px;margin:12px 16px 0;border-radius:var(--radius-panel);background:var(--tone-subtle);box-shadow:inset 3px 0 0 var(--tone)}
.banner>.ic{color:var(--tone);margin-top:2px}
.banner b{display:block;font-weight:var(--weight-semibold)}
.banner p{margin:2px 0 0;color:var(--text-secondary);font-size:var(--fs-small);line-height:var(--lh-small)}
.banner-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.banner.flush{margin:0;border-radius:0}

.meter{display:flex;flex-direction:column;gap:5px}
.meter+.meter{margin-top:11px}
.meter-head{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-small);line-height:var(--lh-small)}
.meter-head .label{font-weight:var(--weight-semibold)}
.meter-head .state{display:inline-flex;align-items:center;gap:4px;color:var(--text-secondary)}
.meter-head .state .ic{color:var(--tone)}
.meter-head .value{margin-left:auto;font-variant-numeric:tabular-nums}
.meter-head .value .max{color:var(--text-muted)}
.track{position:relative;height:6px;border-radius:var(--radius-meter);background:var(--meter-track)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--radius-meter);background:var(--meter-fill);transition:width var(--motion-base) var(--motion-easing)}
.meter.tone-warning .track,.meter.tone-critical .track,.meter.tone-accent .track{background:var(--tone-subtle)}
.meter.tone-warning .fill,.meter.tone-critical .fill,.meter.tone-accent .fill{background:var(--tone)}
.track .tick{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--meter-tick);opacity:.75}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.tile .t-label{font-size:var(--fs-small);line-height:var(--lh-small);color:var(--text-secondary)}
.tile .t-value{font-size:var(--fs-heading);line-height:var(--lh-heading);font-weight:var(--weight-semibold)}
.tile .t-value small{font-size:var(--fs-small);font-weight:400;color:var(--text-muted);margin-left:2px}
.caption{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-muted);margin-top:12px;display:flex;gap:5px;align-items:center}

.counts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:var(--fs-small);line-height:var(--lh-small)}
.counts span{display:inline-flex;align-items:center;gap:5px;color:var(--text-secondary);white-space:nowrap}
.counts b{color:var(--text-primary);font-weight:600;font-variant-numeric:tabular-nums}

.act-line{display:flex;align-items:center;gap:8px;font-size:var(--fs-small);line-height:var(--lh-small);color:var(--text-secondary)}
.act-title{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px}
.act-title b{font-size:var(--fs-heading);line-height:var(--lh-heading);font-weight:600}
.act-title span{color:var(--text-secondary)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0 12px}
.step{display:flex;flex-direction:column;gap:5px;font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-muted)}
.step i{display:block;height:4px;border-radius:2px;background:var(--meter-track)}
.step.done i{background:var(--meter-fill)}
.step.now{color:var(--text-primary);font-weight:600}
.step.now i{background:var(--accent-default)}

.checks{display:flex;flex-direction:column;gap:9px}
.check{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:var(--fs-small);line-height:var(--lh-small)}
.check .ic{margin-top:1px}
.check.ok .ic{color:var(--status-good)}
.check.block .ic{color:var(--status-critical)}
.check.unknown .ic{color:var(--text-muted)}
.check b{font-weight:600}
.check span{color:var(--text-secondary)}

.log{display:flex;flex-direction:column}
.log-row{display:grid;grid-template-columns:60px 16px minmax(0,1fr);gap:8px;align-items:start;height:var(--size-log-row);padding:3px 16px;font-size:var(--fs-small);line-height:var(--lh-small)}
.log-row time{color:var(--text-muted);font-variant-numeric:tabular-nums}
.log-row>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-row .ic{margin-top:2px}
.log-row.sent{color:var(--text-secondary)}
.log-row.sent .ic{color:var(--text-muted)}
.log-row.ok .ic{color:var(--status-good)}
.log-row.warn .ic{color:var(--status-warning)}
.log-row.error .ic{color:var(--status-critical)}
.log-row.info .ic{color:var(--accent-default)}
.log-row:hover{background:var(--surface-hover)}
.log-tools{display:flex;align-items:center;gap:8px;padding:10px 16px 8px}

.strip{height:150px;flex:none;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);background:var(--surface-panel);border-top:1px solid var(--line-subtle)}
.strip>div{padding:12px 16px;min-width:0;overflow:hidden}
.strip>div+div{border-left:1px solid var(--line-subtle);padding:12px 0 0}

.lanes{position:relative;display:grid;grid-template-columns:72px 1fr;row-gap:2px;font-size:var(--fs-caption);line-height:var(--lh-caption)}
.lanes .lane-label{color:var(--text-secondary);height:22px;display:flex;align-items:center}
.lane{position:relative;height:22px;border-bottom:1px solid var(--line-subtle)}
.lane .m{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%}
.lane .m.sent{border:1.5px solid var(--text-muted);background:var(--surface-panel)}
.lane .m.confirmed{background:var(--accent-default)}
.lane .m.rejected{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:0;background:transparent;color:var(--status-critical)}
.lane .m.rejected::before,.lane .m.rejected::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:2px;margin-left:-1px;background:currentColor;transform:rotate(45deg)}
.lane .m.rejected::after{transform:rotate(-45deg)}
.lane .m:hover{transform:scale(1.5)}
.axis{grid-column:2;display:flex;justify-content:space-between;color:var(--text-muted);padding-top:3px}
.tip{position:absolute;z-index:5;transform:translate(-50%,-100%);margin-top:-8px;padding:6px 9px;border-radius:7px;background:var(--surface-selected);box-shadow:0 0 0 1px var(--line-control),0 6px 18px rgba(0,0,0,.3);font-size:var(--fs-small);line-height:var(--lh-small);white-space:nowrap;pointer-events:none}

.board{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--line-subtle);gap:1px;overflow:auto;container:board/inline-size}
.board>*{background:var(--surface-panel)}
.char{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(220px,300px) minmax(220px,300px);gap:20px;align-items:center;padding:16px 20px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-selected);font-size:20px;font-weight:600;line-height:30px}
.char .meter{margin-top:0}
@container board (width < 900px){.char{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);row-gap:12px}.char>.avatar{grid-row:span 2}.char>:nth-child(2){grid-column:2 / span 2}}
.char-name{font-size:var(--fs-display);line-height:var(--lh-display);font-weight:600}
.char-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-small);line-height:var(--lh-small);color:var(--text-secondary);margin-top:2px}
.char-meta span{display:inline-flex;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--radius-chip);background:var(--tone-subtle);font-size:var(--fs-small);font-weight:500;white-space:nowrap}
.chip .ic{color:var(--tone)}
.board-row{display:grid;gap:1px;background:var(--line-subtle)}
.board-row>*{background:var(--surface-panel);min-width:0}
.hero{padding:18px 20px}
.hero .act-title b{font-size:var(--fs-display);line-height:var(--lh-display)}
.dim{opacity:.55}

.connect{flex:1;display:grid;place-items:center;background:var(--surface-panel);padding:24px;overflow:auto}
.connect-card{width:min(440px,100%)}
.connect-card h2{font-size:var(--fs-display);line-height:var(--lh-display);margin:0 0 6px;font-weight:600}
.connect-card>p{color:var(--text-secondary);margin:0 0 20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.field .lbl{font-size:var(--fs-small);line-height:var(--lh-small);font-weight:600;color:var(--text-secondary)}
.input{height:var(--size-control);border-radius:var(--radius-control);border:1px solid var(--line-control);background:var(--surface-raised);padding:0 10px;min-width:0}
select.input{padding-right:6px}
.input.num{width:76px;text-align:right;font-variant-numeric:tabular-nums}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.check-row{display:flex;align-items:center;gap:8px;font-size:var(--fs-small);line-height:var(--lh-small)}
.check-row input{accent-color:var(--accent-default);width:14px;height:14px;margin:0}
.flow{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:10px}
.flow li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.flow .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface-selected);color:var(--text-secondary)}
.flow li.done .n{background:var(--status-good-subtle);color:var(--status-good)}
.flow li.now .n{background:var(--accent-default);color:var(--text-on-accent)}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pick button{display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 12px;border-radius:var(--radius-control);border:1px solid var(--line-control);background:var(--surface-raised);text-align:left}
.pick button:hover{background:var(--surface-hover)}

.setup{padding:4px 0 8px}
.setup.cols{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:0}
.setup.cols .section{border-bottom:0;border-right:1px solid var(--line-subtle)}
.setup .section .field:last-child{margin-bottom:0}
.lockbar{display:flex;gap:8px;align-items:center;margin:12px 16px 0;padding:8px 12px;border-radius:var(--radius-control);background:var(--surface-raised);font-size:var(--fs-small);line-height:var(--lh-small);color:var(--text-secondary)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 9px;border-radius:var(--radius-chip);background:var(--surface-selected);font-size:var(--fs-small)}
.tag button{border:0;background:none;width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--text-secondary)}
.tag button:hover{background:var(--surface-hover)}
.hint{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-muted)}
.slot{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;height:30px;padding:0 8px;border-radius:6px;background:var(--surface-raised);border:1px solid var(--line-subtle);font-size:var(--fs-small)}
.slot+.slot{margin-top:6px}
.slot .key{font-weight:600;color:var(--text-secondary)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled{opacity:.55}

.dock{height:var(--size-dock);flex:none;display:flex;flex-direction:column;background:var(--surface-panel);border-top:1px solid var(--line-subtle);min-height:0}
.dock .tabs{padding:0 12px}
.dock-cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.95fr) minmax(0,1.5fr);gap:1px;background:var(--line-subtle)}
.dock-cols>*{background:var(--surface-panel);overflow:auto;min-width:0}
.dock-cols.no-log{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.95fr)}
.dock .seg.full{max-width:420px}
.dock-cols .section{border-bottom:0}
.dock .banner{margin:10px 12px 0}
.dock-body{flex:1;min-height:0;display:flex;flex-direction:column}

.hud{gap:10px}
.minis{display:flex;align-items:center;gap:10px;flex:none}
@container window (width < 1232px){.minis{display:none}}
.mini{display:flex;flex-direction:column;gap:3px;width:92px;flex:none}
.mini .mh{display:flex;justify-content:space-between;font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-secondary)}
.mini .mh b{color:var(--text-primary);font-weight:600}
.mini .track{height:4px}
.act-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-control);background:var(--surface-raised);border:1px solid var(--line-subtle);font-size:var(--fs-small);white-space:nowrap;max-width:260px;overflow:hidden}
.act-chip b{font-weight:600}
.drawer{width:var(--size-drawer);flex:none;display:flex;flex-direction:column;min-height:0;background:var(--surface-panel);border-left:1px solid var(--line-subtle)}
.ticker{height:34px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface-panel);border-top:1px solid var(--line-subtle);font-size:var(--fs-small);white-space:nowrap;overflow:hidden}
.ticker .ic{color:var(--tone)}
.ticker .msg{overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary)}
.ticker b{color:var(--text-primary);font-weight:600}

.kbd-badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-control);border:1px solid var(--line-subtle);background:transparent;color:var(--text-secondary);font-size:var(--fs-small);white-space:nowrap}
.kbd-badge b{color:var(--text-primary);font-weight:600}
.kbd-badge.game{border-color:var(--accent-default);background:var(--accent-subtle)}
.kbd-badge.game .ic{color:var(--accent-default)}

.sheet-veil{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:20}
.sheet{position:absolute;z-index:21;top:var(--size-toolbar);left:50%;transform:translateX(-50%);width:420px;padding:20px;border-radius:0 0 12px 12px;background:var(--surface-raised);box-shadow:0 0 0 1px var(--line-control),0 18px 50px rgba(0,0,0,.45);animation:drop 220ms var(--motion-easing)}
@keyframes drop{from{transform:translate(-50%,-14px);opacity:0}}
.sheet h3{margin:12px 0 6px;font-size:var(--fs-title);line-height:var(--lh-title)}
.sheet p{margin:0 0 16px;color:var(--text-secondary);font-size:var(--fs-small);line-height:var(--lh-small)}
.sheet .row{display:flex;justify-content:flex-end;gap:8px}
.app-icon{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(160deg,var(--accent-default),#0A5551);color:#fff}
.app-icon .ic{width:26px;height:26px}

.note{display:flex;gap:6px;align-items:flex-start;padding:6px 9px;border:1px dashed var(--accent-default);border-radius:7px;background:color-mix(in srgb,var(--surface-panel) 88%,var(--accent-default));color:var(--text-primary);font-size:var(--fs-caption);line-height:var(--lh-caption);max-width:360px}
.note .ic{color:var(--accent-default);margin-top:1px}
.note.float{position:absolute;z-index:6}
.note-wrap{margin:8px 16px 0}

.pbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;background:#F4F6F8;color:#14171A;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.45);font-size:12px;line-height:16px;font-family:-apple-system,system-ui,sans-serif;max-width:calc(100vw - 24px)}
.pbar button,.pbar select{height:28px;border-radius:8px;border:0;background:transparent;padding:0 9px;display:inline-flex;align-items:center;gap:5px;color:#14171A;font-family:inherit;font-size:12px}
.pbar button:hover{background:#E1E5EA}
.pbar button[aria-pressed="true"]{background:#14171A;color:#fff}
.pbar .ic{width:15px;height:15px}
.pbar .v{min-width:150px;justify-content:center;font-weight:600}
.pbar .sep{width:1px;height:20px;background:#C9CED6}
.pbar .tagp{padding:0 8px;color:#5A616B}
.pbar select{background:#E7EAEE}
.pbar .stepcap{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3A4048}
.simmenu{position:fixed;z-index:51;bottom:66px;left:50%;transform:translateX(-50%);width:min(860px,calc(100vw - 24px));max-height:min(520px,calc(100vh - 100px));overflow:auto;padding:12px;border-radius:14px;background:#F4F6F8;color:#14171A;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 16px 40px rgba(0,0,0,.5);font-family:-apple-system,system-ui,sans-serif;font-size:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.simmenu h4{margin:0 0 6px;font-size:11px;color:#5A616B;font-weight:600}
.simmenu button{display:block;width:100%;text-align:left;height:26px;border:0;border-radius:6px;background:transparent;padding:0 8px;color:#14171A;font-family:inherit;font-size:12px}
.simmenu button:hover:not(:disabled){background:#E1E5EA}
.simmenu button:disabled{color:#9AA1AA}
.flash{display:flex;align-items:center;gap:6px;margin-top:10px;padding:6px 10px;border-radius:var(--radius-control);background:var(--surface-raised);border:1px solid var(--line-control);color:var(--text-primary);font-size:var(--fs-small);line-height:var(--lh-small)}
.flash .ic{color:var(--text-secondary);flex:none}
.tabs-aside .flash{margin:0;padding:2px 10px}
.ticker .flash{margin:0;padding:0;border:0;background:none;min-width:0}

@media (prefers-reduced-motion:reduce){
  .spin,.pulse.march,.pulse.sweep::after{animation:none}
  .pulse.live .beat{animation:blink var(--motion-pulse) linear forwards;left:0;width:100%}
  @keyframes blink{from{opacity:1}to{opacity:0}}
  .sheet{animation:none}
}
</style>

    case 'awaiting-login': return { tone: 'neutral', icon: 'user', label: 'Log in to the game' };

const AUTH_ERROR = { tone: 'critical', icon: 'octagon', title: 'Sign-in failed', body: 'The game service rejected the ID or password. Nothing was stored.', actions: [] };

function preflight(S) {

/* ---------- simulation: invents plausible sample events while running ---------- */
function simulate(S, quiet) {
  const s = S.session, c = S.config[s.activity];
  const w = structuredClone(S.world), run = structuredClone(s.run);
  let vt = S.vt + 1.5, seq = S.seq, beats = 0;
  const logs = [], tl = [], events = [];
  const sent = (text) => { const id = ++seq; logs.push({ t: vt, kind: 'sent', text }); tl.push({ id, t: vt, lane: 'sent', text }); run.sent++; return id; };
  const ok = (text, pair, dt = 0.45) => { logs.push({ t: vt + dt, kind: 'ok', text }); tl.push({ id: ++seq, pair, t: vt + dt, lane: 'confirmed', text }); run.confirmed++; if (pair) run.acked++; beats++; };
  const gain = (name, n = 1) => { run.items[name] = (run.items[name] || 0) + n; w.weight += 3 * n; };
  const goalCheck = (name) => { if (c.goalOn && name === c.goalItem && (run.items[name] || 0) >= c.goalQty) events.push({ type: 'Goal' }); };
  if (s.activity === 'combat') {
    const hpP = pct(w.hp, w.hpMax);
    if (hpP <= c.hpAt && w.potions.hp > 0) {
      const id = sent('Use HP Potion (F5)'); w.potions.hp--; w.hp = Math.min(w.hpMax, w.hp + 330);
      ok(`HP back to ${Math.round(pct(w.hp, w.hpMax))}%. ${w.potions.hp} potions left`, id);
    } else if (hpP <= c.hpAt) {
      events.push({ type: 'Limit', kind: 'hp-potions' });
    } else if (pct(w.mp, w.mpMax) <= c.mpAt && w.potions.mp > 0) {
      const id = sent('Use MP Potion (F6)'); w.potions.mp--; w.mp = Math.min(w.mpMax, w.mp + 220);
      ok(`MP back to ${Math.round(pct(w.mp, w.mpMax))}%. ${w.potions.mp} potions left`, id);
    } else if (w.combatStep === 'approach') {
      const id = sent(`Move toward ${w.target.name}`); w.combatStep = 'attack'; ok(`In range of ${w.target.name}`, id, 0.9);
    } else {
      const sk = c.rotation[0];
      const id = sent(`${sk.skill} on ${w.target.name}`);
      const dmg = 16 + Math.floor(rng() * 22);
      w.target.hp = Math.max(0, w.target.hp - dmg); w.mp = Math.max(0, w.mp - sk.mp);
      if (rng() < 0.6) w.hp = Math.max(1, w.hp - (30 + Math.floor(rng() * 60)));
      ok(`Hit ${w.target.name} for ${fmt(dmg * 7)}`, id);
      if (w.target.hp === 0) {
        const exp = 1180 + Math.floor(rng() * 60);
        run.kills++; run.exp += exp; run.tm += 36; w.exp += 0.42; w.tmExp += 0.6;
        ok(`Defeated ${w.target.name}. +${fmt(exp)} EXP, +36 TM`, null, 0.8);
        const r = rng();
        if (r < 0.09) { gain('Legendary Recipe'); run.noDrop = 0; ok(`Picked up Legendary Recipe. Goal ${run.items['Legendary Recipe']} of ${c.goalQty}`, null, 1.1); goalCheck('Legendary Recipe'); }
        else if (r < 0.48) { const g = 90 + Math.floor(rng() * 80); run.galder += g; w.galder += g; run.noDrop = 0; ok(`Picked up ${g} Galder`, null, 1.1); }
        else if (r < 0.6) { gain('HP Potion'); w.potions.hp++; run.noDrop = 0; ok('Picked up HP Potion', null, 1.1); }
        else { run.noDrop++; logs.push({ t: vt + 1.1, kind: 'info', text: 'No drop' }); }
        w.target = { name: 'Sand Demon', hp: 100, inRange: 1 + Math.floor(rng() * 4) }; w.combatStep = 'approach';
      }
    }
    w.mp = Math.min(w.mpMax, w.mp + 7);
  } else {
    const d = w.dig;
    if (d.step === 0) { d.spot = { x: 50 + Math.floor(rng() * 40), y: 120 + Math.floor(rng() * 40) }; const id = sent(`Pick spot x ${d.spot.x}, y ${d.spot.y}`); ok('Spot accepted', id, 0.4); d.step = 1; }
    else if (d.step === 1) { const id = sent('Move to the spot'); ok(`Arrived at x ${d.spot.x}, y ${d.spot.y}`, id, 1); d.step = 2; }
    else if (d.step === 2) { if (rng() < 0.28) { run.empties++; ok('Empty spot detected. No drill wear', null, 0.6); d.step = 0; } else { ok('Item signal detected', null, 0.6); d.step = 3; d.depth = 0; } }
    else if (d.step === 3) {
      const id = sent('Dig, one press'); w.drill.dur -= 1; d.depth = Math.min(w.drill.depth, d.depth + 6 + Math.floor(rng() * 3));
      ok(`Depth ${d.depth} of ${w.drill.depth}. Durability ${w.drill.dur}`, id, 0.7);
      if (d.depth >= 14) d.step = 4;
      if (w.drill.dur <= c.durabilityAt) events.push({ type: 'Limit', kind: 'drill' });
    } else {
      const r = rng(); const item = r < 0.45 ? 'Tanning Oil' : r < 0.75 ? 'Pebble' : 'Seashell';
      gain(item); run.finds++; run.tm += 14; w.tmExp += 0.35;
      ok(item === c.goalItem ? `Found ${item}. Goal ${run.items[item]} of ${c.goalQty}` : `Found ${item}`, null, 0.5);
      goalCheck(item); d.step = 0;
    }
  }
  if (pct(w.weight, w.weightMax) >= c.weightAt) events.push({ type: 'Limit', kind: 'weight' });
  if (w.exp >= 100) { w.exp -= 100; w.level++; logs.push({ t: vt + 1.2, kind: 'info', text: `Level ${w.level} reached` }); }
  w.freshMs = 140 + Math.floor(rng() * 260);
  run.elapsed += 1.5;
  return { ...S, vt, seq, world: w, session: { ...s, run }, log: [...logs.reverse(), ...S.log].slice(0, 400), timeline: [...S.timeline, ...tl].filter((e) => e.t > vt - 75), beat: S.beat + (beats ? 1 : 0), pending: quiet ? [] : events };
}

    session: initialSession(mode, activity), world: defaultWorld(activity), config: defaultConfig(), log: [], timeline: [], vt: 1000, seq: 0, beat: 0, pending: [],

function seedRun(S) {

  const run = { ...newRun(a), elapsed: 2480, kills: a === 'combat' ? 17 : 0, finds: a === 'digging' ? 9 : 0, empties: a === 'digging' ? 4 : 0, exp: a === 'combat' ? 20450 : 0, tm: a === 'combat' ? 612 : 126, galder: a === 'combat' ? 1840 : 0, items: a === 'combat' ? { 'HP Potion': 3 } : { 'Tanning Oil': 1, Pebble: 4, Seashell: 4 }, sent: 212, acked: 205, confirmed: 296, rejected: 0 };

function ffRun(S, activity) {
  if (activity) S = { ...S, session: { ...S.session, activity }, world: defaultWorld(activity) };
  rng = seeded(7);
  S = fastForward(seedRun(S), 40);
  const goal = S.config[S.session.activity];
  if (goal.goalOn && (S.session.run.items[goal.goalItem] || 0) >= goal.goalQty) S.session.run.items[goal.goalItem] = goal.goalQty - 1;
  S.log = [...S.log, { t: S.vt - 2490, kind: 'info', text: `Run started: ${S.session.activity} on ${S.world.place.map}` }];

}

  'ready-blocked': (S) => { S = SCENARIOS.ready(S); S.world.potions.hp = 0; return S; },

  'paused-weight': (S) => { S = ffRun(S); S.world.weight = 548; return withPhase(S, { phase: 'paused', reason: { code: 'weight' } }); },
  'paused-fainted': (S) => { S = ffRun(S); S.world.hp = 0; return withPhase(S, { phase: 'paused', reason: { code: 'fainted' } }); },

  disconnected: (S) => withPhase(ffRun(S), { phase: 'disconnected', attempt: 5 }),
  'error-build': (S) => { S = ffRun(S); return withPhase(S, { phase: 'error', halt: { code: 'build-changed' }, lastRun: S.session.run, run: null }); },
  'error-client': (S) => { S = ffRun(S); return withPhase(S, { mode: 'client', phase: 'error', halt: { code: 'client-failed', why: 'webkit' }, lastRun: S.session.run, run: null }); },

function transitionLog(prev, next, ev) {
  const t = S.vt;

      <div class="field"><span class="lbl">Pause after kills without a drop</span>${num('noDropKills', 'kills', 0, 500)}</div></div>`,
  ] : [
    html`<div class="section"><h4 class="sec-title">Where</h4>
      <div class="field"><span class="lbl">Map</span>${mapSel}<span class="hint">Pick a map where you can dig in the game.</span></div>
      <div class="field"><span class="lbl">Spot selection</span>${seg('spotMode', [['bot', 'Bot picks'], ['semi', 'Game semi-auto'], ['pet', 'Pet auto-dig']])}</div>

  ];

}
function Guidance() {
  const s = S.session;
  if (s.phase === 'client-absent') return html`<div class="section"><h4 class="sec-title">Get started</h4><ol class="flow"><li class="now"><span class="n">1</span><div>Load the game client.</div></li><li><span class="n">2</span><div>Log in inside the game.</div></li><li><span class="n">3</span><div>Choose an activity and start.</div></li></ol></div>`;
  if (s.phase === 'client-loading' || s.phase === 'awaiting-login') return html`<div class="section"><h4 class="sec-title">Get started</h4><ol class="flow"><li class=${s.phase === 'client-loading' ? 'now' : 'done'}><span class="n">${s.phase === 'client-loading' ? '1' : html`<${Ic} n="check" c="sm" />`}</span><div>Load the game client.${s.phase === 'client-loading' ? html`<div class="muted">The game page is loading, ${Math.round(s.progress * 100)}%.</div>` : ''}</div></li><li class=${s.phase === 'awaiting-login' ? 'now' : ''}><span class="n">2</span><div>Log in inside the game.${s.phase === 'awaiting-login' ? html`<div class="muted">The bot starts reading state when your character enters the world. It never sees your password.</div>` : ''}</div></li><li><span class="n">3</span><div>Choose an activity and start.</div></li></ol></div>`;
  if (s.phase === 'offline') return html`<div class="section"><h4 class="sec-title">Get started</h4><p class="secondary" style="margin:0">Sign in on the left. The bot connects without the game client and controls one character.</p></div>`;
  if (s.phase === 'connecting') return html`<div class="section"><h4 class="sec-title">Get started</h4><p class="secondary" style="margin:0">Choose a world and a character on the left. Setup is available now.</p></div>`;
  return null;
}
function RunTab({ withActivity = true, withSession = false }) {
  const s = S.session; const g = Guidance();
  if (g) return g;
  const hasRun = !!s.run;
  return html`<div>
    ${withActivity && (hasRun || ['pausing', 'stopping'].includes(s.phase)) ? html`<div class="section"><${ActivityNow} /></div>` : ''}
    <div class="section"><h4 class="sec-title">Vitals</h4><${Vitals} compact=${true} /></div>
    ${hasRun ? html`<div class="section"><h4 class="sec-title">This run</h4><${RunStats} /></div>` : ''}
    ${s.phase === 'ready' ? html`<div class="section"><h4 class="sec-title">Before you start<span class="aside">${s.activity === 'combat' ? 'Combat' : 'Digging'}</span></h4><${Preflight} /></div>` : ''}
    ${!hasRun && s.lastRun ? html`<div class="section"><h4 class="sec-title">Last run<span class="aside">ended</span></h4><${RunStats} /></div>` : ''}
    ${withSession ? html`<div class="section"><h4 class="sec-title">Session</h4><${SessionLines} /></div>` : ''}
  </div>`;
}

/* ---------- game pane and clientless board ---------- */
function GamePane() {
  const s = S.session; const p = s.phase;
  let inner;
  if (p === 'client-absent') {
    inner = html`<div class="gpui-panel"><div class="inner"><${Ic} n="client" c="lg" /><h3>The game client is not loaded</h3><p>Load the game to show it here. OpenTrickster opens tr-play.playall.in.th inside this window.</p><button class="btn primary" onClick=${go({ type: 'LoadGame' })}>Load game</button></div></div>`;
  } else if (p === 'error' && s.halt.code === 'client-failed') {
    const f = CLIENT_FAILURES[s.halt.why || 'webkit'];
    inner = html`<div class="gpui-panel"><div class="inner"><span class="chip tone-critical"><${Ic} n="octagon" c="sm" />${f.label}</span><h3>The game client stopped</h3><p>${f.body}</p><button class="btn primary" onClick=${go({ type: 'ReloadGame' })}>Reload game</button></div></div>`;
  } else if (p === 'client-loading') {
    inner = html`<div class="game-splash"><div><div class="ttl">Game loading screen</div><div class="bar"><i style=${{ width: Math.round(s.progress * 100) + '%' }}></i></div><div style="font-size:12px;opacity:.7">Drawn by the game page, not by OpenTrickster</div></div></div>`;
  } else if (p === 'awaiting-login') {
    inner = html`<div class="game-splash"><div class="login-card"><div style="font-weight:600">Game login screen</div><div style="font-size:12px;opacity:.7;margin-top:2px">Drawn by the game page. The bot cannot read what you type here.</div><div class="fake"></div><div class="fake"></div><button class="btn sm proto" style="margin-top:6px" onClick=${go({ type: 'CharacterSeen' })}>Enter the world (simulated)</button></div></div>`;
  } else {
    const t = S.world.target; const dig = s.activity === 'digging';
    inner = html`<div class="scene">
      <i class="mk me" style="left:46%;top:62%"></i>
      ${dig ? html`<i class="mk spot" style="left:58%;top:70%"></i>` : html`<i class="mk foe t" style="left:57%;top:56%"></i><i class="mk foe" style="left:70%;top:73%"></i><i class="mk foe" style="left:30%;top:80%"></i>`}
      <span class="game-tag"><${Ic} n="client" c="sm" />Game client placeholder. The real game renders here in a WKWebView.</span>
    </div>`;
  }
  return html`<section class=${'stage' + (S.ui.kbd === 'game' ? ' kbd-game' : '')} onMouseDown=${() => { if (S.ui.kbd !== 'game') dispatch({ type: 'ui', patch: { kbd: 'game' } }); }} aria-label="Game client">
    <div class="game">${inner}</div>
    <${Note} float style="left:14px;top:12px">This rectangle is a native WKWebView. It sits outside GPUI clipping and paint order (#4), so tooltips, banners, and the focus ring stay outside it. Menus and dialogs over it still need proof in #11.<//>
  </section>`;
}
function Strip() {
  const last = S.log.find((r) => r.kind === 'ok');
  return html`<div class="strip">
    <div><h4 class="sec-title">Last minute<span class="aside">${last ? 'Last confirmed ' + clockAt(last.t) : ''}</span></h4><${Lanes} /></div>
    <div style="display:flex;flex-direction:column"><h4 class="sec-title" style="padding:0 16px">Recent</h4><div class="scroll"><${LogList} limit=${6} /></div></div>
  </div>`;
}
function ConnectPanel() {
  const s = S.session; const st = s.phase === 'connecting' ? s.connectStep : -1;
  if (s.phase === 'offline') {
    return html`<div class="connect"><div class="connect-card">
      <h2>Connect without the game client</h2>
      <p>OpenTrickster signs in to the game service directly and controls one character. The game client stays closed.</p>
      ${s.authError ? html`<div style="margin-bottom:14px"><${Banner} b=${AUTH_ERROR} flush /></div>` : ''}
      <div class="field"><label for="acc">Game ID</label><input id="acc" class="input" value=${CHARACTER.account} /></div>
      <div class="field"><label for="pw">Password</label><input id="pw" class="input" type="password" value="sample-pass" /></div>
      <label class="check-row" style="margin:4px 0 16px"><input type="checkbox" checked />Store the password in macOS Keychain</label>
      <div class="inline"><button class="btn primary" onClick=${go({ type: 'Connect' })}>Sign in</button><button class="btn proto" onClick=${go({ type: 'proto/auth-failed' })} title="Prototype only">Simulate a rejected password</button></div>
      <${Note}>Clientless transport is unproven (#3). Client metadata names a LoginServer ticket, a GameServer handoff, and a second-password hint. These are leads, not verified steps, so this flow may need a second password step.<//>
    </div></div>`;
  }
  return html`<div class="connect"><div class="connect-card">
    <h2>Connecting</h2><p>Signed in as ${CHARACTER.account}. The game client stays closed.</p>
    <ol class="flow">${CONNECT_STEPS.map((n, i) => html`<li class=${i < st ? 'done' : i === st ? 'now' : ''}><span class="n">${i < st ? html`<${Ic} n="check" c="sm" />` : i + 1}</span><div><div>${n}</div>
      ${i === st && i === 1 ? html`<div class="pick"><button onClick=${go({ type: 'ConnectStep' })}><span>World 1</span><span class="muted">Normal</span></button><button onClick=${go({ type: 'ConnectStep' })}><span>World 2</span><span class="muted">Busy</span></button></div>` : ''}
      ${i === st && i === 2 ? html`<div class="pick"><button onClick=${go({ type: 'ConnectStep' })}><span><b>${CHARACTER.name}</b></span><span class="muted">Lv 24, ${PLACES[s.activity].map}</span></button><button disabled><span>Second slot</span><span class="muted">Empty</span></button></div>` : ''}
      ${i === st && (i === 0 || i === 3) ? html`<div class="muted"><${Ic} n="spinner" c="sm" /> Working</div>` : ''}

    <div style="margin-top:18px"><button class="btn" onClick=${go({ type: 'Cancel' })}>Cancel</button></div>
  </div></div>`;

function CharacterHeader() {

function Traffic() { return html`<div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>`; }

function StatusLine() { return html`<span class="status-line"><${BuildLabel} /><${Freshness} /></span>`; }

/* ---------- variant C: focus HUD ---------- */
function Mini({ label, value, max, tone = 'neutral' }) {
  return html`<div class=${`mini meter tone-${tone}`}><div class="mh"><span>${label}</span><b class="num">${Math.round(pct(value, max))}%</b></div><div class="track"><div class="fill" style=${{ width: pct(value, max) + '%' }}></div></div></div>`;
}
function Minis() {
  const w = S.world, cc = S.config.combat, c = S.config[S.session.activity]; const wp = pct(w.weight, w.weightMax);
  return html`<span class="minis"><span class="tb-sep"></span><${Mini} label="HP" value=${w.hp} max=${w.hpMax} tone=${hpTone(w, cc)} /><${Mini} label="MP" value=${w.mp} max=${w.mpMax} tone=${pct(w.mp, w.mpMax) <= cc.mpAt ? 'warning' : 'neutral'} /><${Mini} label="Weight" value=${w.weight} max=${w.weightMax} tone=${wp >= c.weightAt ? 'critical' : wp >= c.weightAt - 10 ? 'warning' : 'neutral'} /></span>`;
}
function Ticker({ runControls }) {
  if (S.ui.flash) return html`<div class="ticker tone-neutral"><${Flash} /></div>`;
  const s = S.session; const b = bannerOf(S);
  if (b) {
    const si = startInfo();
    const ctl = !runControls ? [] : s.phase === 'paused' ? [{ label: 'Resume', ev: { type: 'Resume' }, primary: true, disabled: !si.enabled }]
      : canStop() && ['reconnecting', 'disconnected'].includes(s.phase) ? [{ label: 'End run', ev: { type: 'EndRun' } }] : [];
    return html`<div class=${'ticker tone-' + b.tone} data-banner><${Ic} n=${b.icon} /><b>${b.title}</b><span class="msg">${b.body}</span><span class="spacer"></span>${[...ctl, ...b.actions].map((a) => html`<button class=${'btn sm' + (a.primary ? ' primary' : '') + (a.proto ? ' proto' : '')} disabled=${a.disabled} onClick=${go(a.ev)}>${a.label}</button>`)}</div>`;
  }
  const why = blockedText();
  if (why) return html`<div class="ticker tone-warning"><${Ic} n="warn" /><span class="msg">${why}</span><span class="spacer"></span><${StatusLine} /></div>`;
  const last = S.log.find((r) => r.kind === 'ok');
  const st = statusOf(S);
  const showLast = last && s.phase !== 'error';
  return html`<div class=${'ticker tone-' + st.tone}><${Ic} n=${showLast ? 'check' : st.icon} />${showLast ? html`<span class="muted num">${clockAt(last.t)}</span><span class="msg">${last.text}</span>` : html`<span class="msg">${st.label}</span>`}<span class="spacer"></span><${StatusLine} /></div>`;
}
function VariantC() {
  const s = S.session, w = S.world, t = S.ui.tab;
  const open = S.ui.drawer;
  const actChip = s.run ? (s.activity === 'combat' ? html`<span class="act-chip"><${Ic} n="combat" c="sm" /><b>${w.target.name}</b> ${w.target.hp}%</span>` : html`<span class="act-chip"><${Ic} n="dig" c="sm" /><b>${DIG_STEPS[w.dig.step]}</b> depth ${w.dig.depth}</span>`) : '';
  return html`<div class="window">
    <div class="toolbar hud"><${Traffic} /><${Pill} />${actChip}
      ${hasCharacter(s) ? html`<${Minis} />` : ''}
      ${s.run ? html`<span class="secondary num" style="font-size:12px"><${Ic} n="clock" c="sm" /> ${duration(s.run.elapsed)}</span>` : ''}
      <span class="spacer"></span><${ModeSwitch} small=${true} /><${RunControls} variant="C" /><${KbdBadge} />
      <button class="btn icon-only" aria-pressed=${open} title="Show or hide details (⌘\\)" onClick=${ui({ drawer: !open })}><${Ic} n="sidebar" /></button>
    </div>
    <${Pulse} />
    <div class="body">
      <div class="main">${s.mode === 'client' ? html`<${GamePane} />` : html`<${Board} parts=${{ session: true, vitals: !open, log: true }} />`}</div>
      ${open ? html`<aside class="drawer" onMouseDown=${() => { if (S.ui.kbd !== 'dashboard') dispatch({ type: 'ui', patch: { kbd: 'dashboard' } }); }}>
        <${Tabs} names=${['Details']} />
        <div class="scroll">${t === 'run' ? html`<${RunTab} withActivity=${s.mode === 'client'} withSession=${s.mode === 'client'} />` : t === 'setup' ? html`<${SetupPanel} cols=${1} />` : html`<${LogTools} /><${LogList} />`}</div>
      </aside>` : ''}
    </div>
    <${Ticker} runControls />
    <${Sheet} />
  </div>`;
}

/* ---------- prototype bar (not part of the design) ---------- */
const SIM_GROUPS = [
  ['Game client', [['Load game', { type: 'LoadGame' }], ['Log in (character enters)', { type: 'CharacterSeen' }], ['Game fails: network', { type: 'GameFailed', why: 'network' }], ['Game fails: page load', { type: 'GameFailed', why: 'navigation' }], ['Game fails: start-up', { type: 'GameFailed', why: 'unity' }], ['WebKit process ends', { type: 'GameFailed', why: 'webkit' }], ['Game build changes', { type: 'BuildChanged' }]]],
  ['Run', [['Start', { type: 'Start' }], ['Pause', { type: 'Pause' }], ['Resume', { type: 'Resume' }], ['Stop', { type: 'Stop' }], ['Switch activity: combat', { type: 'SetActivity', activity: 'combat' }], ['Switch activity: digging', { type: 'SetActivity', activity: 'digging' }], ['Switch mode', { type: 'proto/switch' }]]],
  ['Run problems', [['HP potions run out', { type: 'Limit', kind: 'hp-potions' }], ['Bag weight limit', { type: 'Limit', kind: 'weight' }], ['Drill durability limit', { type: 'Limit', kind: 'drill' }], ['Drill too shallow', { type: 'Limit', kind: 'depth' }], ['Character faints', { type: 'Fainted' }], ['No drops for 30 kills', { type: 'NoDrops' }], ['State goes stale', { type: 'Stale' }], ['Goal reached', { type: 'Goal' }], ['Actions rejected', { type: 'Rejected' }], ['Map blocks automation', { type: 'MapForbidden' }], ['Fix it in the game', { type: 'proto/fix' }]]],
  ['Connection', [['Connection drops', { type: 'Lost' }], ['Session resumes', { type: 'ResumeOk' }], ['Reconnect attempt fails', { type: 'RetryFailed' }], ['Reconnect', { type: 'Reconnect' }], ['Signed in elsewhere', { type: 'Replaced' }], ['Sign in (clientless)', { type: 'Connect' }], ['Next connect step', { type: 'ConnectStep' }]]],
];
function evAllowed(ev) {
  if (ev.type.startsWith('proto/')) return true;
  return canSession(S.session, ev.type);
}
function ProtoBar() {
  if (!S.ui.chrome) return null;
  const v = S.ui.variant; const keys = Object.keys(VARIANTS);
  const cycle = (d) => () => setVariant(keys[(keys.indexOf(v) + d + keys.length) % keys.length]);
  const wt = WALKTHROUGHS[S.ui.scenario]; const ix = S.ui.stepIx;
  return html`
  ${S.ui.sim ? html`<div class="simmenu">${SIM_GROUPS.map(([g, items]) => html`<div><h4>${g}</h4>${items.map(([l, ev]) => html`<button disabled=${!evAllowed(ev)} onClick=${() => dispatch(ev)}>${l}</button>`)}${g === 'Connection' ? html`<label style="display:flex;gap:6px;align-items:center;padding:6px 8px"><input type="checkbox" checked=${S.ui.reconnectFails} onChange=${(e) => dispatch({ type: 'ui', patch: { reconnectFails: e.target.checked } })} />Reconnect keeps failing</label>` : ''}</div>`)}</div>` : ''}
  <div class="pbar" role="toolbar" aria-label="Prototype controls">
    <button onClick=${cycle(-1)} aria-label="Previous variant"><${Ic} n="left" /></button>
    <button class="v" onClick=${cycle(1)}>${v} · ${VARIANTS[v]}</button>
    <button onClick=${cycle(1)} aria-label="Next variant"><${Ic} n="right" /></button>
    <span class="sep"></span>
    <button aria-pressed=${S.ui.theme === 'light'} onClick=${() => setTheme(S.ui.theme === 'dark' ? 'light' : 'dark')}><${Ic} n=${S.ui.theme === 'dark' ? 'moon' : 'sun'} />${S.ui.theme === 'dark' ? 'Dark' : 'Light'}</button>
    <button aria-pressed=${S.ui.notes} onClick=${ui({ notes: !S.ui.notes })}><${Ic} n="note" />Open questions</button>
    <button aria-pressed=${S.ui.sim} onClick=${ui({ sim: !S.ui.sim })}><${Ic} n="bolt" />Simulate</button>
    <span class="sep"></span>
    <select aria-label="Guided scenario" onChange=${(e) => startWalk(e.target.value)} value=${S.ui.scenario}><option value="">Guided scenario…</option>${Object.keys(WALKTHROUGHS).map((k) => html`<option value=${k}>${k}</option>`)}</select>
    ${wt ? html`<button onClick=${nextStep} disabled=${ix >= wt.steps.length}><${Ic} n="play" />${ix >= wt.steps.length ? 'Done' : `Step ${ix + 1} of ${wt.steps.length}`}</button><span class="stepcap">${ix < wt.steps.length ? wt.steps[ix][0] : 'Scenario finished'}</span>` : ''}
    <span class="sep"></span><span class="tagp">Sample data</span>
  </div>`;
}
function startWalk(name) {
  if (!name) { dispatch({ type: 'ui', patch: { scenario: '', stepIx: 0 } }); return; }
  const wt = WALKTHROUGHS[name];
  let base = { ...S, session: initialSession(wt.start === 'connect' ? 'clientless' : 'client', wt.activity || 'combat'), world: defaultWorld(wt.activity || 'combat'), log: [], timeline: [], vt: 1000, seq: 0, beat: 0 };
  base = applyScenario(base, wt.start);
  S = { ...base, ui: { ...S.ui, scenario: name, stepIx: 0, sheet: false } };
  paint();
}
function nextStep() {
  const wt = WALKTHROUGHS[S.ui.scenario]; const ix = S.ui.stepIx;
  if (!wt || ix >= wt.steps.length) return;
  S = { ...S, ui: { ...S.ui, stepIx: ix + 1 } };
  if (wt.steps[ix][1]) dispatch(wt.steps[ix][1]); else paint();
}
function setVariant(v) { dispatch({ type: 'ui', patch: { variant: v, tab: S.ui.tab } }); syncUrl(); }
function setTheme(t) { dispatch({ type: 'ui', patch: { theme: t, themeSet: true } }); syncUrl(); }
function syncUrl() {
  const q = new URLSearchParams(location.search); q.set('variant', S.ui.variant);
  if (S.ui.themeSet) q.set('theme', S.ui.theme); else q.delete('theme');
  history.replaceState(null, '', '?' + q.toString());
}
SYSTEM_DARK.addEventListener('change', (e) => { if (!S.ui.themeSet) dispatch({ type: 'ui', patch: { theme: e.matches ? 'dark' : 'light' } }); });

function App() {
  document.documentElement.dataset.theme = S.ui.theme;
  document.body.classList.toggle('bare', !S.ui.chrome);
  const V = { A: VariantA, B: VariantB, C: VariantC }[S.ui.variant];
  return html`<div class="desk"><${V} /></div><${ProtoBar} />`;
}
function paint() { render(html`<${App} />`, document.getElementById('root')); }

addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'select' || tag === 'textarea';
  const mod = e.metaKey || e.ctrlKey; const k = e.key.toLowerCase();
  if (mod && k === 'r') { e.preventDefault(); return dispatch({ type: S.session.phase === 'paused' ? 'Resume' : 'Start' }); }
  if (mod && k === 'p') { e.preventDefault(); return dispatch({ type: 'Pause' }); }
  if (mod && k === '.') { e.preventDefault(); if (canStop()) dispatch(stopEv()); return; }
  if (mod && ['1', '2', '3'].includes(k)) { e.preventDefault(); return dispatch({ type: 'ui', patch: { tab: ['run', 'setup', 'log'][+k - 1], rail: true } }); }
  if (e.ctrlKey && e.key === 'Tab') { e.preventDefault(); return dispatch({ type: 'ui', patch: { kbd: S.ui.kbd === 'game' ? 'dashboard' : 'game' } }); }
  if (mod && e.key === '\\') { e.preventDefault(); return dispatch({ type: 'ui', patch: S.ui.variant === 'C' ? { drawer: !S.ui.drawer } : { rail: !S.ui.rail } }); }
  if (e.key === 'Escape' && S.ui.sheet) return dispatch({ type: 'ui', patch: { sheet: false } });
  if (!typing && !mod && S.ui.kbd !== 'game' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const keys = Object.keys(VARIANTS); setVariant(keys[(keys.indexOf(S.ui.variant) + (e.key === 'ArrowLeft' ? -1 : 1) + keys.length) % keys.length]);
  }
});
paint();
</script>
</body>
